[project]
name = "neyta"
version = "0.1.0"
description = "Search, preview, extract and stem-split audio from Soulseek, YouTube and SoundCloud."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "PySide6-Addons==6.11.1",
    "yt-dlp>=2026.7.4",
    "requests>=2.31.0",
    "keyring>=25",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-timeout>=2.3"]

[tool.setuptools.packages.find]
include = ["neyta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast suite is the default. Anything touching the network or a display
# has to be asked for by name.
addopts = "-m 'not integration and not ui' --strict-markers -q"
timeout = 60
markers = [
    "integration: needs the network or a live service (skipped by default)",
    "ui: needs a Qt display via pytest-qt (skipped by default)",
    "env: asserts this checkout's interpreters and binaries are intact",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::DeprecationWarning:neyta.*"]
